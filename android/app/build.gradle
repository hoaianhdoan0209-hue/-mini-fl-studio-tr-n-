plugins {
    id 'com.android.application'
}
android {
    namespace 'com.minifl.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.minifl.studio'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
